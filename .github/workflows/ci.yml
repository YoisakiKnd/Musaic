name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与本机开发环境保持一致：pubspec 只要求 >=3.29.0，但门禁必须跑在
  # 开发实际使用的版本上，否则「本地绿、CI 红」或反之都失去意义。
  # 升级 Flutter 时请同步此处与本机版本。
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    name: 静态分析 + 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态分析（零警告基线）
        run: flutter analyze --no-pub

      - name: 单元 + Widget 测试（含覆盖率）
        run: flutter test --coverage --no-pub --reporter expanded

      # 覆盖率门禁（T2）：脚本零依赖（纯标准库解析 lcov.info），
      # 因此无需在 CI 安装 lcov。分层阈值见 tool/check_coverage.py。
      - name: 覆盖率门槛
        run: python3 tool/check_coverage.py --verbose

  build-android:
    name: Android 构建冒烟
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # 干净环境必须可构建：不再依赖改本机 pub cache 的补丁脚本。
      - name: 构建 debug APK
        run: flutter build apk --debug --no-pub
