name: musaic
description: 多渠道音乐播放器（Music + Mosaic）
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态与架构
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0

  # 网络
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # 存储
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # 播放
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # UI 与体验
  flutter_lyric: ^3.0.0
  palette_generator_master: ^1.0.1
  cached_network_image: ^3.4.0
  liquid_glass_container_plus: ^1.0.4
  window_manager: ^0.4.0
  xml: ^6.5.0
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
