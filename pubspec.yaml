name: musaic
description: "Musaic = Music + Mosaic —— 汇聚多方音源的多渠道音乐播放器。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态与架构
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # 网络
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1

  # 存储
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1     # 本地音乐扫描的媒体权限运行时请求

  # 播放内核
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # UI 与体验
  cached_network_image: ^3.4.0
  palette_generator: ^0.3.3+7      # 封面取色（官方包）
  window_manager: ^0.4.3          # 桌面窗口（最小尺寸等）
  xml: ^6.5.0                     # TTML 解析
  encrypt: ^5.0.3
  crypto: ^3.0.3                 # 网易云 weapi 登录加密
  qr_flutter: ^4.1.0              # 登录二维码渲染
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
